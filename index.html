<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>고속 초간편 PDF 병합기</title>
  <!-- 브라우저용 pdf-lib 라이브러리 직접 불러오기 -->
  <script src="https://unpkg.com/pdf-lib/dist/pdf-lib.min.js"></script>
  <style>
    body {
      font-family: 'Malgun Gothic', sans-serif;
      max-width: 500px;
      margin: 80px auto;
      padding: 30px;
      border: 1px solid #e0e0e0;
      border-radius: 12px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.05);
      text-align: center;
    }
    h2 { color: #333; margin-bottom: 20px; }
    input[type="file"] { margin: 20px 0; width: 100%; }
    button {
      background-color: #0070f3;
      color: white;
      border: none;
      padding: 14px 20px;
      font-size: 16px;
      border-radius: 6px;
      cursor: pointer;
      width: 100%;
      font-weight: bold;
    }
    button:hover { background-color: #0051bb; }
    #status { margin-top: 15px; color: #666; font-size: 14px; font-weight: bold; }
  </style>
</head>
<body>

  <h2>⚡ 초고속 PDF 파일 하나로 합치기</h2>
  <p>여러 개의 PDF 파일을 첨부해 주세요. (서버 전송 없이 내 컴퓨터에서 즉시 합쳐집니다)</p>
  
  <input type="file" id="pdfFiles" accept="application/pdf" multiple />
  <button onclick="mergePDFsLocally()">PDF 병합 후 다운로드</button>
  <div id="status"></div>

  <script>
    async function mergePDFsLocally() {
      const fileInput = document.getElementById('pdfFiles');
      const statusDiv = document.getElementById('status');
      const files = fileInput.files;

      if (files.length === 0) {
        alert('병합할 PDF 파일을 1개 이상 선택해 주세요.');
        return;
      }

      statusDiv.innerText = '⚡ 초고속 병합 작업 중...';
      statusDiv.style.color = '#0070f3';

      try {
        // 새 PDF 문서 생성
        const mergedPdf = await PDFLib.PDFDocument.create();

        // 선택한 파일을 순서대로 읽어서 브라우저 내부 메모리에서 합치기
        for (let i = 0; i < files.length; i++) {
          const fileBytes = await files[i].arrayBuffer();
          const pdf = await PDFLib.PDFDocument.load(fileBytes);
          const copiedPages = await mergedPdf.copyPages(pdf, pdf.getPageIndices());
          copiedPages.forEach((page) => mergedPdf.addPage(page));
        }

        // 완성된 PDF 바이너리 생성
        const mergedPdfBytes = await mergedPdf.save();

        // 다운로드 실행
        const blob = new Blob([mergedPdfBytes], { type: 'application/pdf' });
        const downloadUrl = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = downloadUrl;
        a.download = '최종_취합본.pdf';
        document.body.appendChild(a);
        a.click();
        a.remove();

        statusDiv.innerText = '✅ 1초 만에 병합 완료!';
        statusDiv.style.color = '#2e7d32';
      } catch (err) {
        console.error(err);
        statusDiv.innerText = '❌ 병합 중 오류가 발생했습니다. (보안 걸린 PDF인지 확인해보세요)';
        statusDiv.style.color = '#d32f2f';
      }
    }
  </script>

</body>
</html>
