<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>PDF 통합 편집 & 병합 도구</title>
  
  <!-- pdf-lib 핵심 라이브러리 -->
  <script src="https://unpkg.com/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script>
  <!-- 파일 다운로드를 돕는 라이브러리 -->
  <script src="https://unpkg.com/downloadjs@1.4.7/download.min.js"></script>
  <!-- ⭐️ PDF 암호화 처리를 위한 추가 라이브러리 -->
  <script src="https://unpkg.com/@pdf-lib/upng@1.0.1/dist/UPNG.js"></script>
  
  <style>
    body { font-family: 'Malgun Gothic', sans-serif; padding: 20px; background: #eef2f5; }
    .card { background: white; padding: 30px; border-radius: 10px; max-width: 600px; margin: 0 auto; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
    h2 { text-align: center; color: #333; margin-top: 0; }
    .option-group { margin: 20px 0; padding: 15px; background: #f8f9fa; border-radius: 8px; border: 1px solid #ddd; }
    label { display: block; margin-bottom: 8px; font-weight: bold; color: #555; }
    input[type="file"] { width: 100%; padding: 5px; margin-bottom: 10px; }
    input[type="text"], input[type="password"], select { 
      width: 100%; padding: 10px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 4px; 
    }
    .info-text { font-size: 12px; color: #888; margin-top: 5px; display: block; }
    button { background: #0056b3; color: white; border: none; padding: 15px; border-radius: 6px; cursor: pointer; width: 100%; font-size: 18px; font-weight: bold; transition: 0.3s; }
    button:hover { background: #004494; }
  </style>
</head>
<body>

<div class="card">
  <h2>📄 PDF 병합 & 편집 도구</h2>
  
  <!-- 1. 파일 선택 -->
  <div class="option-group">
    <label>1. 병합할 PDF 파일 선택 (여러 개 가능)</label>
    <input type="file" id="pdfFiles" accept="application/pdf" multiple>
    <span class="info-text">※ 여러 파일을 선택하면 선택된 순서대로 병합됩니다.</span>
  </div>

  <!-- 2. 페이지 추출 -->
  <div class="option-group">
    <label>2. 특정 페이지만 추출 (선택사항)</label>
    <input type="text" id="pageRange" placeholder="예: 1, 3-5 (비워두면 전체 병합)">
    <span class="info-text">※ 쉼표(,)와 하이픈(-)을 사용해 원하는 페이지만 골라냅니다.</span>
  </div>

  <!-- 3. 회전 -->
  <div class="option-group">
    <label>3. 페이지 일괄 회전</label>
    <select id="rotationAngle">
      <option value="0">원본 방향 유지</option>
      <option value="90">시계 방향 90도 회전</option>
      <option value="180">180도 회전 (뒤집기)</option>
      <option value="270">시계 반대 방향 90도 회전</option>
    </select>
  </div>

  <!-- 4. 암호 설정 -->
  <div class="option-group">
    <label>4. 문서 열기 비밀번호 (선택사항)</label>
    <input type="password" id="pdfPassword" placeholder="비밀번호 미설정 시 비워두세요">
    <span class="info-text">※ 설정 시, 파일을 열 때 이 비밀번호를 입력해야 합니다.</span>
  </div>

  <button onclick="processAndMergePDFs()" id="processBtn">작업 시작 및 다운로드</button>
</div>

<script>
  const { PDFDocument, degrees } = PDFLib;

  async function processAndMergePDFs() {
    const fileInput = document.getElementById('pdfFiles');
    const pageRangeInput = document.getElementById('pageRange').value.trim();
    const rotation = parseInt(document.getElementById('rotationAngle').value);
    const password = document.getElementById('pdfPassword').value;
    const btn = document.getElementById('processBtn');

    if (fileInput.files.length === 0) {
      alert("최소 1개 이상의 PDF 파일을 선택해 주세요.");
      return;
    }

    try {
      btn.innerText = "처리 중... 잠시만 기다려주세요";
      btn.disabled = true;
      btn.style.background = "#999";

      // 새 문서 생성
      const mergedPdf = await PDFDocument.create();

      // 파일 순회하며 병합
      for (let file of fileInput.files) {
        const fileBuffer = await file.arrayBuffer();
        const pdf = await PDFDocument.load(fileBuffer);
        const totalPages = pdf.getPageCount();

        let pagesToCopy = [];
        
        // 페이지 범위 파싱
        if (pageRangeInput) {
          const parts = pageRangeInput.split(',');
          parts.forEach(part => {
            if (part.includes('-')) {
              const [start, end] = part.split('-').map(num => parseInt(num.trim()) - 1);
              for (let i = start; i <= end; i++) {
                if (i >= 0 && i < totalPages) pagesToCopy.push(i);
              }
            } else {
              const pageIdx = parseInt(part.trim()) - 1;
              if (pageIdx >= 0 && pageIdx < totalPages) pagesToCopy.push(pageIdx);
            }
          });
        } else {
          pagesToCopy = Array.from({ length: totalPages }, (_, i) => i);
        }

        const copiedPages = await mergedPdf.copyPages(pdf, pagesToCopy);

        // 회전 적용 및 삽입
        copiedPages.forEach(page => {
          if (rotation !== 0) {
            page.setRotation(degrees(page.getRotation().angle + rotation));
          }
          mergedPdf.addPage(page);
        });
      }

      // 암호화 옵션 설정
      let saveOptions = {};
      if (password) {
        saveOptions = {
          useObjectStreams: false,
          userPassword: password,   // 열기 비밀번호
          ownerPassword: password,  // 편집 권한 비밀번호 (동일하게 설정)
        };
      }

      // PDF 저장 (암호화가 있다면 적용)
      const pdfBytes = await mergedPdf.save(saveOptions);

      // 다운로드
      download(pdfBytes, "merged_result.pdf", "application/pdf");
      alert("작업이 완료되었습니다!");

    } catch (err) {
      console.error(err);
      alert("PDF 처리 중 오류가 발생했습니다. 원본 파일이 손상되었거나 암호가 걸려있을 수 있습니다.");
    } finally {
      // 버튼 상태 복구
      btn.innerText = "작업 시작 및 다운로드";
      btn.disabled = false;
      btn.style.background = "#0056b3";
    }
  }
</script>

</body>
</html>
